# Task 2 — Poka-Yoke Automated CI/CD Build Gate
# -----------------------------------------------

name: Poka-Yoke Build Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A second push to the same PR cancels the in-flight run for the first —
# prevents a stale, already-failed run from ever being confused with a
# passing one.
concurrency:
  group: build-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # only needed to post the quarantine comment on failure

jobs:
  # ---------------------------------------------------------------------
  # Gate 1 — Secret scan. Runs first and independently of every other gate:
  # a leaked credential is the one failure mode that must never be masked
  # by an unrelated lint failure elsewhere in the matrix.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the merge commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        # No continue-on-error anywhere in this file. gitleaks-action exits
        # non-zero on any finding, which is exactly what "fail-closed" means
        # here: the job goes red and every downstream job is skipped.

      - name: Fail explicitly on any hardcoded key pattern gitleaks' default rules miss
        run: |
          set -euo pipefail
          # Defence in depth for the specific case called out in the brief:
          # raw, hardcoded API secret keys committed straight into application code.
          if grep -RInE \
            "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_\-]{35}|api[_-]?key\s*=\s*['\"][0-9a-zA-Z]{16,}['\"])" \
            --include="*.py" --include="*.tf" --include="*.js" --include="*.ts" .; then
            echo "::error::Hardcoded credential pattern detected in application code. Build quarantined."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Gate 2 — Terraform formatting, validation, and lint.
  # ---------------------------------------------------------------------
  terraform-lint:
    name: Terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt (check only — never auto-fix in CI)
        run: terraform fmt -check -recursive

      - name: terraform init (backend-less, validate only)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint (google ruleset — catches missing labels, unscoped IAM, deprecated args)
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

